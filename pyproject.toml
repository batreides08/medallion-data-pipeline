[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medallion-pipeline"
version = "0.1.0"
description = "End-to-end PySpark data pipeline built on the Medallion architecture."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pyspark==4.2.1"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.17,<0.18"]

[project.scripts]
medallion-pipeline = "medallion_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medallion_pipeline = ["sql/gold/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "parquet_io: writes Parquet to disk; skipped on Windows unless HADOOP_HOME is set",
]

[tool.coverage.run]
source = ["medallion_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
